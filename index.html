  :root{--paper:#ffdf9a;--paper2:#f4bf70;--ink:#4b1a0e;--edge:#e08a14;--edge2:#5a2408}
  html,body{margin:0;height:100%;overflow:hidden;background:#5d6173;color:var(--ink);
    font-family:'VT323','Courier New',monospace}
  #view{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab;touch-action:none;filter:saturate(1.22) contrast(1.06)}
  #view.drag{cursor:grabbing}
  .panel{position:fixed;background:var(--paper);border:4px solid var(--edge2);border-radius:6px;
    box-shadow:inset 0 0 0 2px #ffeec2,inset 0 0 0 5px var(--edge),inset 0 0 0 6px #b5600c,inset 0 0 0 8px #8f3f08,4px 5px 0 rgba(30,10,5,.45);
    padding:14px 18px;user-select:none;text-shadow:1px 1px 0 rgba(255,238,194,.9)}
  #title{background:none;border:0;box-shadow:none;text-shadow:none;padding:6px 4px}
  #title #wx,#title #wxsub{text-shadow:-1px -1px 0 #3a1606,1px -1px 0 #3a1606,-1px 1px 0 #3a1606,1px 1px 0 #3a1606,0 2px 0 #3a1606}
  #logo{display:block;width:189px;height:126px;image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(2px 3px 0 rgba(30,10,5,.35))}
  #name{position:fixed;top:12px;left:16px;margin:0;font-size:36px;line-height:1;font-weight:400;letter-spacing:1px;user-select:none;pointer-events:none;color:#ffd23f;text-shadow:2px 2px 0 #5a2408,-1px -1px 0 #5a2408,1px -1px 0 #5a2408,-1px 1px 0 #5a2408,0 3px 0 #5a2408}
  #clock{color:#ffeec2;opacity:1 !important;text-shadow:1px 1px 0 #5a2408}
  #title{top:14px;right:14px;text-align:right}
  #clock{font-size:20px;opacity:.8;margin-top:2px}
  #svbox{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin:0 0 4px}
  #dial{width:88px;height:52px;image-rendering:pixelated;filter:drop-shadow(2px 2px 0 rgba(40,15,5,.45))}
  #svcol{background:var(--paper);border:3px solid var(--edge2);border-radius:4px;box-shadow:inset 0 0 0 2px #ffeec2,inset 0 0 0 4px var(--edge);min-width:116px;text-align:center;color:var(--ink);text-shadow:1px 1px 0 rgba(255,238,194,.9)}
  #svcol>div{padding:1px 10px}
  #svcol #clock{color:var(--ink);text-shadow:inherit;opacity:1 !important;font-size:21px;margin:3px 0 0}
  #icons{border-top:2px dashed var(--edge);border-bottom:2px dashed var(--edge);font-size:17px;line-height:1.35;letter-spacing:6px}
  #time{font-size:23px;margin-bottom:2px}
  #wx{font-size:20px;color:#ffeec2;text-shadow:1px 1px 0 #5a2408;margin-top:1px;white-space:nowrap}
  #wxsub{font-size:14px;color:#f6d79c;text-shadow:1px 1px 0 #5a2408;white-space:nowrap;letter-spacing:.3px}
  #roster{left:14px;bottom:14px;padding:8px 11px}
  #roster h2{margin:0 0 3px;font-size:16px;font-weight:400;border-bottom:2px dashed var(--edge);padding-bottom:1px}
  #count{font-size:13px;opacity:.65}
  #roster h2{cursor:pointer}
  #roster.shut ul{display:none}
  #roster.shut h2{border-bottom:0;margin:0;padding:0}
  #roster ul{--rh:clamp(8px,calc((100vh - 118px)/var(--n,35)),12px);list-style:none;margin:0;padding:0;font-size:calc(var(--rh)*1.07);line-height:1}   /* one column; rows shrink on short screens so everyone still fits */
  #roster li{display:flex;gap:4px;align-items:center;white-space:nowrap;cursor:pointer;padding:0 2px;border-radius:3px;height:var(--rh);overflow:hidden}
  #roster li:hover,#roster li.on{background:var(--paper2)}
  #roster .dot{width:7px;height:7px;flex:none;border:1px solid var(--edge2)}
  #roster li>span:nth-child(2){min-width:4.6em}
  #roster .ic{font-size:.75em;width:1.1em;text-align:center;flex:none}
  #roster .tx{font-size:.94em;opacity:.72}
  #roster li.walk .tx,#roster li.walk .ic{opacity:.45}
  #roster li.away{opacity:.42}
  #wxbox{margin:0 0 0 auto;width:max-content;max-width:250px;background:var(--paper);border:3px solid var(--edge2);border-radius:4px;box-shadow:inset 0 0 0 2px #ffeec2,inset 0 0 0 4px var(--edge),3px 4px 0 rgba(30,10,5,.4);padding:4px 10px 5px;text-align:right}
  #title #wxbox #wx,#title #wxbox #wxsub{color:var(--ink);text-shadow:1px 1px 0 rgba(255,238,194,.9)}#title #wxbox #wxsub{opacity:.8}
  #wxbox:has(#wx:empty):has(#wxsub:empty){display:none}
  #np{margin:6px 0 0 auto;width:max-content;max-width:250px;background:var(--paper);border:3px solid var(--edge2);border-radius:4px;box-shadow:inset 0 0 0 2px #ffeec2,inset 0 0 0 4px var(--edge),3px 4px 0 rgba(30,10,5,.4);
    color:var(--ink);text-shadow:1px 1px 0 rgba(255,238,194,.9);text-align:left;padding:4px 10px 5px;line-height:1.05}
  #np>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #np .h{font-size:13px;opacity:.7;border-bottom:2px dashed var(--edge);padding-bottom:2px;margin-bottom:3px;letter-spacing:.5px}
  #npT{font-size:19px}#npA{font-size:15px;opacity:.85}#npB{font-size:13px;opacity:.7;margin-top:2px}
  #help{right:14px;bottom:14px;font-size:17px;padding:9px 14px;opacity:.97}
  #help b{background:var(--paper2);border:1px solid var(--edge);border-radius:3px;padding:0 4px}
  #help b,#sndL{cursor:pointer}
  @media (max-width:700px){#help{font-size:13px;padding:7px 9px;right:8px;bottom:8px;max-width:126px;line-height:1.5}#name{font-size:22px;top:10px;left:10px}#logo{width:113px;height:75px}#dial{display:none}#wx{font-size:17px}#wxsub{display:none}#np{max-width:200px}#npT{font-size:16px}#roster .tx{display:none}#roster .ic{margin-left:auto}}
  /* top-right column: three matching cards, same width, same spacing */
  #title{width:200px;padding:0}
  #svbox,#wxbox,#np{box-sizing:border-box;width:100%;max-width:none;margin:0 0 6px;background:var(--paper);border:3px solid var(--edge2);border-radius:4px;
    box-shadow:inset 0 0 0 2px #ffeec2,inset 0 0 0 4px var(--edge),3px 4px 0 rgba(30,10,5,.4);color:var(--ink);text-shadow:1px 1px 0 rgba(255,238,194,.9);text-align:left}
  #svbox{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;position:relative}
  #dial{width:66px;height:39px;flex:none;position:absolute;right:100%;margin-right:8px;top:50%;transform:translateY(-50%);filter:drop-shadow(2px 2px 0 rgba(40,15,5,.45))}   /* the dial sits just outside the clock card, to its left */
  #svcol{background:none;border:0;box-shadow:none;min-width:0;flex:1;text-align:center}
  #svcol>div{padding:1px 2px}#svcol #clock{font-size:16px;margin:0}#time{font-size:18px;margin:0}
  #icons{font-size:13px;line-height:1.3;margin:2px 0}
  #wxbox,#np{padding:5px 9px 6px;line-height:1.1}
  #title .h{font-size:11px;opacity:.7;border-bottom:2px dashed var(--edge);padding-bottom:2px;margin-bottom:4px;letter-spacing:.5px;white-space:nowrap}
  #title #wxbox #wx{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
  #title #wxbox #wxsub{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  #np{margin-bottom:0}#title #npT{font-size:15px}#title #npA{font-size:12px}#title #npB{font-size:11px}

// The scene is drawn top-down, the way old farming and town games are: north is up, each floor tile is 16 pixels,
// and anything with height is drawn that many pixels higher on the screen, so you see its top and its south side.
const TS=16;                       // tile size in pixels
const W=44, H=22;                  // office size in tiles
const GFH=40, FLH=28;              // height in pixels of a building's street level, and of each storey above it
const OZ=OFFICE_FLOOR>1?GFH+FLH*(Math.min(OFFICE_FLOOR,8)-2):0;   // how high the office floor sits above the street
const WX0=-16*TS, WX1=64*TS, WY0=-(OZ+12*TS), WY1=36*TS;        // the part of the world that gets drawn (x right, y down; the office's corner is 0,0)
const BW=WX1-WX0, BH=WY1-WY0;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,w);c.height=Math.max(1,h);return c};

function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20261011);
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
let SR=mulberry(20261013);                                          // the office's own dice: every viewer rolls exactly the same numbers
const rand=(a,b)=>a+SR()*(b-a);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=SR()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pickR=a=>a[R()*a.length|0];

/* ---------- colour and pixel helpers ---------- */
function parse(c){if(c[0]==='#'){const n=parseInt(c.slice(1),16);return[n>>16&255,n>>8&255,n&255]}const m=c.match(/\d+/g);return[+m[0],+m[1],+m[2]]}
function mix(c,f){const[r,g,b]=parse(c),t=f<0?0:255,a=Math.abs(f);return`rgb(${r+(t-r)*a|0},${g+(t-g)*a|0},${b+(t-b)*a|0})`}
const INK='#2e1a16';                                             // the warm dark outline everything gets
const px=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
function outlined(src,col=INK){                                  // a copy of a sprite with a one-pixel outline around it
  const o=mk(src.width+2,src.height+2),g=o.getContext('2d'),s=mk(src.width,src.height),sg=s.getContext('2d');
  sg.drawImage(src,0,0);sg.globalCompositeOperation='source-in';sg.fillStyle=col;sg.fillRect(0,0,s.width,s.height);
  g.drawImage(s,0,1);g.drawImage(s,2,1);g.drawImage(s,1,0);g.drawImage(s,1,2);g.drawImage(src,1,1);o.o=1;return o;
}
const sprite=(w,h,draw,line=INK)=>{const c=mk(w,h);draw(c.getContext('2d'));return line?outlined(c,line):c};
const flipX=src=>{const c=mk(src.width,src.height),g=c.getContext('2d');g.translate(src.width,0);g.scale(-1,1);g.drawImage(src,0,0);c.o=src.o;return c};
function oval(g,cx,cy,rx,ry,c){g.fillStyle=c;for(let y=Math.ceil(cy-ry);y<cy+ry;y++){const t=(y+.5-cy)/ry,hw=Math.round(rx*Math.sqrt(Math.max(0,1-t*t)));if(hw>0)g.fillRect(Math.round(cx-hw),y,hw*2,1)}}

const T=(i,j)=>inb(i,j)?tile[ix(i,j)]:VOID;
const open=(i,j)=>{const t=T(i,j);return t===FLOOR||t===DOOR};
function room(i0,j0,i1,j1,k){for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){tile[ix(i,j)]=FLOOR;kind[ix(i,j)]=k}}

// piece(kind, i, j, name, build): runs build() and records the sprites, blocked tiles, seats, spots and shadows it made
function piece(kind,i,j,name,build,opts){
  const sol=solid.slice(),seats=seatAt.slice(),len={},tn=things.length;for(const g in SPOTS)len[g]=SPOTS[g].length;
  let id=kind+'@'+i+','+j;while(PIECES.some(q=>q.id===id))id+="'";
  const p={id,kind,name,di:0,dj:0,things:[],blocks:[],seats:[],spots:[],shades:[],children:[],color:null,desk:(opts&&opts.desk)||null};
  CUR=p;build();CUR=null;
  for(let n=tn;n<things.length;n++){const t=things[n];t.ox=t.x;t.oy=t.y;t.obase=t.base;t.orig=t.cv;p.things.push(t)}
  for(let n=0;n<W*H;n++){if(solid[n]&&!sol[n])p.blocks.push([n%W,n/W|0]);if(seatAt[n]&&seatAt[n]!==seats[n])p.seats.push([n%W,n/W|0,seatAt[n]])}
  for(const g in SPOTS)for(let k=len[g]||0;k<SPOTS[g].length;k++){const sp=SPOTS[g][k];sp.oi=sp.i;sp.oj=sp.j;p.spots.push(sp)}
  if(p.desk){p.desk.oi=p.desk.i;p.desk.oj=p.desk.j;p.desk.oti=p.desk.ti}
  PIECES.push(p);return p;
}

  {const L=drops.getChannelData(0),R=drops.getChannelData(1),N=L.length;

const MOODS={                                                      // all major keys and bright chord loops: hopeful, sunny, a little bouncy
  spring:{root:62,scale:[0,2,4,5,7,9,11],bpm:100,prog:[[0,4,5,3],[3,4,0,0],[0,3,4,3]]},
  summer:{root:64,scale:[0,2,4,5,7,9,11],bpm:108,prog:[[0,4,5,3],[0,3,4,4],[3,4,2,5]]},
  fall:{root:60,scale:[0,2,4,5,7,9,11],bpm:96,prog:[[0,5,3,4],[3,4,0,5],[0,3,1,4]]},
  winter:{root:62,scale:[0,2,4,6,7,9,11],bpm:88,prog:[[0,1,0,4],[3,4,0,0],[0,5,1,4]]},
  rain:{root:60,scale:[0,2,4,5,7,9,11],bpm:86,prog:[[3,4,0,5],[0,4,5,3],[3,0,4,0]]},
  night:{root:59,scale:[0,2,4,5,7,9,11],bpm:78,prog:[[0,3,4,0],[0,5,3,4],[3,4,0,0]]},
};
function moodNow(kind,night){
  if(kind==='rain'||kind==='drizzle'||kind==='storm')return'rain';if(night)return'night';
  const s=DECO.season;return s==='halloween'||s==='fall'?'fall':s==='holiday'||s==='winter'||s==='valentine'?'winter':s==='spring'?'spring':'summer';
}
function playPiece(at,moodName,rng){                                   // 16 bars: A A' B A, twice round, then a last ringing chord
  const M=MOODS[moodName],beat=60/M.bpm,bar=beat*4,R=M.scale.length,rnd=rng||Math.random;
  const deg=(d,oct)=>M.root+12*(oct-4+Math.floor(d/R))+M.scale[((d%R)+R)%R];   // oct 4 = the key's own octave, around middle C
  const prog=M.prog[rnd()*M.prog.length|0].concat(M.prog[rnd()*M.prog.length|0]);   // 8 chords, one per bar
  const rhythms=[[1,.5,.5,1,1],[.5,.5,1,.5,.5,1],[.75,.25,1,.75,.25,1],[1,.5,.5,2],[.5,.5,.5,.5,1,1],[1.5,.5,1,1]];   // bouncier
  const motif=()=>{const out=[];for(let b=0;b<2;b++){const r=rhythms[rnd()*rhythms.length|0];let t=0;for(const d of r){out.push({b,t,d,strong:t%2===0});t+=d}}return out};
  const A=motif(),B=motif();
  const melodyFor=(m,chords,prev)=>{let cur=prev;return m.map(n=>{const chord=chords[n.b],ch=[chord,chord+2,chord+4];
    if(n.strong){let best=ch[0]+7,bd=99;for(const c of ch)for(const o of[0,7]){const v=c+o;if(v<0||v>8)continue;const dd=Math.abs(v-cur);if(dd<bd){bd=dd;best=v}}cur=best}
    else cur=Math.max(0,Math.min(8,cur+(rnd()<.62?1:-1)*(rnd()<.75?1:2)));return cur})};
  let cur=4;const pan=()=>(rnd()-.5)*.5;
  for(let rep=0;rep<2;rep++)for(let bi=0;bi<8;bi++){
    const t0=at+(rep*8+bi)*bar,chord=prog[bi],section=bi<2?A:bi<4?A:bi<6?B:A,half=bi%2;
    // guitar: a rolling arpeggio, bass on beats 1 and 3
    const tones=[deg(chord,3),deg(chord+2,3),deg(chord+4,3),deg(chord+7,3)],pat=[0,2,3,2,1,2,3,2];
    pluck(mhz(deg(chord,2)),t0,.06,bar*.95,-.2);pluck(mhz(deg(chord+4,2)),t0+.01,.04,bar*.9,-.15);          // left hand
    pat.forEach((k,j)=>{if(j>0)pluck(mhz(tones[k]),t0+j*beat/2+(rnd()-.5)*.01,j%2?.024:.032,1.3,.15+pan()*.4)});   // right hand, a lilting bounce
    bassNote(mhz(deg(chord,2)),t0,beat*3.6,.05);
    // the tune: softer the first time round, fuller the second
    if(bi%2===0){const notes=section,pitches=melodyFor(notes,[prog[bi],prog[bi+1]],cur);cur=pitches[pitches.length-1];
      notes.forEach((n,j)=>{let p=pitches[j];if(bi===6&&j===notes.length-1)p=7;                    // land home at the end
        if(bi===2&&j>=notes.length-2)p+=rnd()<.5?1:-1;                                             // A': change the ending a little
        flute(mhz(deg(p,4)),t0+(n.b*4+n.t)*beat,n.d*beat*.9,rep?.032:.022)})}
  }
  const end=at+16*bar;pluck(mhz(deg(0,2)),end,.06,4,-.2);for(const d of[0,2,4,7])pluck(mhz(deg(d,3)),end+d*.04,.035,4,pan());bassNote(mhz(deg(0,2)),end,3.5,.05);flute(mhz(deg(7,4)),end,2.4,.025);
  return 16*bar+3.5;
}
function sndTick(){
  if(!SND.on||!SND.C||SND.C.state!=='running')return;
  {const J=JOHNNY;if(J.whistle!=null&&J.whistle!==J.played&&SIM.t<J.sayUntil&&/whistling/.test(J.say)){J.played=J.whistle;whistleTune(J.whistle)}}
  const now=SND.C.currentTime,[kind]=wxNow(),night=cur.dark>.5,wet=cur.rain,snow=cur.snow,storm=cur.storm;
  SND.rainG.gain.setTargetAtTime(Math.min(.8,wet*wet*.65+storm*.2),now,1.2);SND.dropG.gain.setTargetAtTime(wet>.03?Math.min(.6,.2+wet*.35+storm*.08):0,now,1.2);
  if((kind==='storm'||kind==='fog')&&due('whale',now,14+Math.random()*14))whale(now+.2);   // whales, only in storms and fog
  if(storm>.3){const t=wxT,cy=Math.floor(t/8);if(cy!==SND.lastCy){SND.lastCy=cy;const ft=cy*8+(h2(cy,91)%500)/100;   // soft rolling thunder after each flash
    if(ft-t>-.2&&h2(cy,17)%2===0){const at=now+Math.max(0,ft-t)+.8+Math.random()*1.5;burst(4.5+Math.random()*1.5,.28+Math.random()*.12,'lowpass',320,55,at,.5)}}}
  if(!night&&wet<.05&&snow<.05&&(kind==='clear'||kind==='cloudy')&&due('bird',now,3.5+Math.random()*6))birdSong(now+Math.random()*.5);
  if(night&&wet<.05&&snow<.05&&cur.cover<.5&&due('cricket',now,1+Math.random()*.6))crickets(now);
  if(snow>.1&&due('spark',now,2.5+Math.random()*3.5))bell(any_([1568,1760,2093,2349,2637]),now,.012,3);
  if(kind==='fog'&&due('horn',now,30+Math.random()*30)){tone(110,104,4,.045,'sine',now,1.2,.9);tone(220,208,3.5,.012,'sine',now,1.2,.9)}
  {const ms=Date.now(),slot=Math.floor(ms/300000),start=slot*300000+h2(slot,7)%180000;   // music on a clock schedule: everyone listening hears the same piece at the same time
   if(h2(slot,3)%5!==0&&slot!==MUS.lastSlot&&ms>=start&&ms<start+5000&&now>MUS.until){MUS.lastSlot=slot;MUS.until=now+.3+playPiece(now+.3,moodNow(kind,night),mulberry(slot))}}
}
setInterval(sndTick,100);
function whistleTune(seed){                                          // Johnny's whistle: a short, made-up, breezy little tune
  if(!SND.on||!SND.C||SND.C.state!=='running')return;const C=SND.C,r=mulberry(seed*2654435761>>>0);
  const scale=[0,2,4,7,9,12,14,16],root=74;let t=C.currentTime+.05,d=0;
  for(let k=0;k<9;k++){d=Math.max(0,Math.min(7,d+(r()<.5?-1:1)*(r()<.7?1:2)));if(k===8)d=0;
    const f=440*Math.pow(2,(root+scale[d]-69)/12),len=k===8?.7:[.18,.18,.36][r()*3|0];
    const o=C.createOscillator(),g=C.createGain(),v=C.createOscillator(),vg=C.createGain();o.type='sine';o.frequency.setValueAtTime(f*.97,t);o.frequency.exponentialRampToValueAtTime(f,t+.04);
    v.frequency.value=6;vg.gain.value=f*.012;v.connect(vg);vg.connect(o.frequency);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+.03);g.gain.setValueAtTime(.03,t+len*.7);g.gain.linearRampToValueAtTime(0,t+len);
    o.connect(g);g.connect(SND.master);o.start(t);o.stop(t+len+.05);v.start(t);v.stop(t+len+.05);t+=len+.02}
}
const sndLbl=()=>{const e=document.getElementById('sndL');if(e)e.textContent=SND.on?'🔊 sound on':'🔇 sound off'};
function sndToggle(){
  SND.on=!SND.on;
  if(SND.on){if(!SND.C&&!sndBuild()){SND.on=false;sndLbl();return}SND.C.resume();SND.next={}}
  else if(SND.C)SND.C.suspend();
  try{localStorage.setItem('kotoNY.sound',SND.on?'1':'0')}catch(_){}
  sndLbl();
}
document.addEventListener('visibilitychange',()=>{if(!SND.C)return;if(document.hidden)SND.C.suspend();else if(SND.on)SND.C.resume()});
{let want=false;try{want=localStorage.getItem('kotoNY.sound')==='1'}catch(_){}            // sound was on last time: it starts at the first click or key press (browsers need one)
 if(want){const go=()=>{document.removeEventListener('pointerdown',go,true);document.removeEventListener('keydown',go,true);if(!SND.on)setTimeout(sndToggle,0)};
   document.addEventListener('pointerdown',go,true);document.addEventListener('keydown',go,true)}}

/* ---------- one shared office: everyone's copy is worked out from the clock, so every viewer sees the same thing ---------- */
const TICK=500;let RESYNC_AT=0;
function nyAnchor(ms){                                              // 8:00 this morning in New York (or yesterday's, before 8)
  nyCalc(ms);const local=ms+offMin*60000,a=Math.floor(local/864e5)*864e5+8*36e5-offMin*60000;return ms<a?a-864e5:a}
function resetSim(anchor){
  SR=mulberry((anchor/1000|0)^0x5bd1e995);resv.clear();mmSession=0;mmWas=false;NP.slot=-1;NP.recent.length=0;
  SIM.lastOut=-1e12;
  for(const c of chars)Object.assign(c,{street:null,away:true,state:'away',path:[],act:null,go:'desk',say:'',icon:'',spot:null,t:0,sit:false,up:0,leaving:false,next:null,justIn:false,out:null,pair:null,ate:false,ownSay:null,mm:0,qReal:null,bub:9,x:-9,y:-9,px:-9,py:-9,fresh:true});
  Object.assign(JOHNNY,{away:true,street:null,sx:POST[0],sy:POST[1],psx:POST[0],psy:POST[1],say:'',sayUntil:0,sdir:'S'});
  SIM.t=anchor;SIM.next=nyAnchor(anchor+30*36e5);offKey=-1;
}
function stepSim(){
  for(const c of chars){c.px=c.x;c.py=c.y;c.fresh=false;c.psx=c.sx;c.psy=c.sy}JOHNNY.psx=JOHNNY.sx;JOHNNY.psy=JOHNNY.sy;
  update(TICK/1000);SIM.t+=TICK;
  if(SIM.t>=SIM.next)resetSim(SIM.next);                            // a new day
}
function trafficStep(){for(const ln of lanes)for(const c of ln.cars)c.pp=c.p;traffic(.1);TRF.k++}
function resync(){                                                  // rebuild today from 8:00 to now
  resetSim(nyAnchor(Date.now()));const now=Date.now();while(SIM.t+TICK<=now)stepSim();
  for(const ln of lanes)ln.cars.length=0;TRF.k=Math.floor(now/100)-1800;while(TRF.k<Math.floor(now/100))trafficStep();
}
/* ---------- custom tasks: people add things their character does; saved to a shared Google Sheet so every copy of this file sees them ----------
   Only the tasks are sent (no other text). Every copy checks the sheet once a minute; when tasks change, everyone's day is rebuilt the same way. */
const TK={rows:{},key:'',busy:false};
const nameOf=t=>{const q=String(t||'').trim().toLowerCase();return(COWORKERS.find(d=>!d.staff&&d.name.toLowerCase()===q)||{}).name||null};
const GUESS=[[/\b(call|phone|ring|zoom)/i,'pace','📞'],[/\b(coffee|latte|espresso)/i,'coffee','☕'],[/\btea\b/i,'kitchen','🍵'],[/\b(lunch|eat|eating|food|snack)/i,'lunchTable','🥪'],
  [/\b(meeting|presenting|present|pitch|review|crit)/i,'bigMeeting','📊'],[/\b(read|book)/i,'armchair','📖'],[/\bplant/i,'plants','🪴'],[/\b(window|view)/i,'window','🌤️'],
  [/\b(with|chat|talk|gossip|catch up|help)/i,'visit','💬'],[/\b(nap|rest|relax|couch)/i,'couch','🛋️'],[/\b(sketch|draw|design|illustrat|paint)/i,'desk','🎨'],
  [/\b(animat|render|edit|video|motion)/i,'desk','🎞️'],[/\b(write|writing|email|brief|copy)/i,'desk','✍️'],[/\b(music|song|sonos|playlist)/i,'desk','🎵'],[/\b(dog|cat|pet)/i,'visit','🐶']];
function toTask(text){                                              // "calling the printer" -> {say:"📞 calling the printer", place:"pace"}
  let t=String(text).replace(/[\u0000-\u001f<>]/g,'').replace(/\s+/g,' ').trim().slice(0,44);if(t.length<2)return null;
  const g=GUESS.find(([re])=>re.test(t))||[null,'desk','📝'];const lead=t.match(/^\p{Extended_Pictographic}/u);
  const who=COWORKERS.find(d=>!d.staff&&new RegExp('\\b'+d.name.replace(/\s+/g,'\\s+')+'\\b','i').test(t));   // a coworker named in the task: go and do it with them
  return{say:(lead?'':(who?'💬':g[2])+' ')+t.charAt(0).toLowerCase()+t.slice(1),place:who?'visit:'+who.name:g[1]};
}
function cleanTasks(list){const out=[];if(!Array.isArray(list))return out;const ok=['desk','visit','coffee','kitchen','couch','window','plants','armchair','pace','bigMeeting','lunchTable'];
  for(const a of list.slice(0,6)){if(!a)continue;const say=String(a.say||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,46);const vp=/^visit:/.test(a.place)&&nameOf(String(a.place).slice(6));if(say)out.push({say,place:vp?'visit:'+vp:ok.includes(a.place)?a.place:'desk'})}return out}
function applyTasks(rows){                                         // rebuild routines from the sheet, then rejoin the shared day
  const m={};for(const r of rows){const n=nameOf(r.person);if(n){const t=cleanTasks(r.tasks);if(t.length)m[n]=t}}
  const key=JSON.stringify(Object.keys(m).sort().map(k=>[k,m[k]]));if(key===TK.key)return;TK.key=key;TK.rows=m;
  for(const d of COWORKERS){const extra=(m[d.name]||[]).map(a=>({go:a.place,say:a.say,secs:[60,150],w:2,custom:true}));d.routine=d.base.concat(extra)}
  resync();taskUI();
}
async function pullTasks(){try{const r=await fetch(TASKS_URL,{cache:'no-store'});const j=await r.json();if(j&&j.ok&&Array.isArray(j.rows))applyTasks(j.rows)}catch(_){}}
async function pushTasks(name,tasks){const r=await fetch(TASKS_URL,{method:'POST',body:JSON.stringify({person:name,tasks})});const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'not saved')}
function taskUI(){
  const name=nameOf(document.getElementById('tName').value),list=document.getElementById('tList');list.textContent='';
  for(const [k,a]of(name&&TK.rows[name]||[]).entries()){const sp=document.createElement('span'),x=document.createElement('button');sp.textContent=a.say;x.type='button';x.textContent='✕';x.title='Remove';x.setAttribute('aria-label','Remove '+a.say);
    x.addEventListener('click',()=>saveTasks(name,TK.rows[name].filter((_,j)=>j!==k),'Removed.'));sp.appendChild(x);list.appendChild(sp)}
}
async function saveTasks(name,tasks,done){
  const msg=document.getElementById('tMsg'),btn=document.getElementById('tSave');if(TK.busy)return;TK.busy=true;btn.disabled=true;msg.textContent='Saving…';
  try{await pushTasks(name,tasks);await pullTasks();msg.textContent=done}catch(_){msg.textContent='That didn\u2019t save. Check your internet connection and try again.'}
  TK.busy=false;btn.disabled=false;
}
if(TASKS_URL){
  const form=document.getElementById('tasks'),dl=document.getElementById('tNames');
  for(const d of COWORKERS){if(d.staff)continue;const o=document.createElement('option');o.value=d.name;dl.appendChild(o)}
  try{const n=localStorage.getItem('kotoNY.name');if(n)document.getElementById('tName').value=n}catch(_){}
  form.hidden=false;document.body.classList.add('tasking');
  document.getElementById('tName').addEventListener('input',taskUI);
  form.addEventListener('submit',e=>{e.preventDefault();const msg=document.getElementById('tMsg'),name=nameOf(document.getElementById('tName').value);
    if(!name){msg.textContent='Pick your name from the list first.';return}
    try{localStorage.setItem('kotoNY.name',name)}catch(_){}
    const add=document.getElementById('tNew').value.split(/[,;\n]+/).map(toTask).filter(Boolean);
    if(!add.length){msg.textContent='Type one or more tasks, separated by commas.';return}
    const all=(TK.rows[name]||[]).concat(add);if(all.length>6)msg.textContent='Each person can have up to 6 tasks, so only the first 6 were kept.';
    document.getElementById('tNew').value='';saveTasks(name,all.slice(0,6),'Added for '+name+'. Everyone will see it within 30 seconds.')});
  pullTasks();setInterval(pullTasks,30000);
}
/* ---------- go ---------- */
let last=0,hudT=0;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;const now=Date.now();
  if(RESYNC_AT&&now>RESYNC_AT&&!grab.c){RESYNC_AT=0;resync()}       // a little while after someone's been moved, rejoin everyone else's office
  let n=0;while(SIM.t+TICK<=now&&n++<4000)stepSim();
  SIM.a=Math.max(0,Math.min(1,(now-SIM.t)/TICK));
  {const J=JOHNNY;J.rsx=J.psx+(J.sx-J.psx)*SIM.a;J.rsy=J.psy+(J.sy-J.psy)*SIM.a}
  for(const c of chars)if(c.street){c.rsx=c.psx+(c.sx-c.psx)*SIM.a;c.rsy=c.psy+(c.sy-c.psy)*SIM.a}
  for(const c of chars){if(c.held||c.fresh){c.rx=c.x;c.ry=c.y}else{c.rx=c.px+(c.x-c.px)*SIM.a;c.ry=c.py+(c.y-c.py)*SIM.a}}
  n=0;const tk=Math.floor(now/100);if(tk-TRF.k>3000)TRF.k=tk-3000;while(TRF.k<tk&&n++<3000)trafficStep();TRF.a=Math.max(0,Math.min(1,now/100-TRF.k));
  wxStep(dt);decoClock+=dt;
  if(follow){const[fx,fy]=charXY(follow),k=Math.min(1,dt*4);cam.cx+=(fx-cam.cx)*k;cam.cy+=(fy-14-cam.cy)*k}
  render();
  if((hudT-=dt)<=0){hud();hudT=.3}
  requestAnimationFrame(frame);
}
resync();                                                          // work out the office as it is right now
for(const c of chars){c.rx=c.x;c.ry=c.y}
hud();resize();requestAnimationFrame(frame);
window.__office={JOHNNY,SIM,TRF,resync,stepSim,nyAnchor,SND,mondayActive,setMM:v=>{mmPreview=v},nyHour,timeFactor,tagOf,PIECES,solid,seatAt,walk,chim:()=>CHIMNEYS,sunCalc,daylight,wxStep,cur,pv,live,loadWeather,LIT,LAMPS,hud,update,render,chars,buf,cam,things,scene,DESKS,SPOTS,lanes,parked,OZ,charXY,WX0,WY0,TS};
})();
